# Workers do treino distribuído da CPU do awbw4, no CircleCI (o mesmo que o workflow do
# GitHub Actions): descarrega do site o worker empacotado e joga pares de partidas.
# Variável do projeto no CircleCI: AI_TRAINING_KEY = a CHAVE DOS WORKERS do awbw4.
# Correr: Trigger Pipeline com o parâmetro run_training = true.
version: 2.1

parameters:
  run_training:
    type: boolean
    default: false
  campaign:
    type: string
    default: ""
  parallelism:
    type: integer
    default: 1
  workers:
    type: integer
    default: 2
  jobs_per_runner:
    type: integer
    default: 0
  minutes:
    type: integer
    default: 55
  site:
    type: string
    default: "https://awbw.vitamindanswers.com"

jobs:
  ai-training:
    docker:
      - image: cimg/node:20.19
    resource_class: medium
    parallelism: << pipeline.parameters.parallelism >>
    steps:
      - run:
          name: Jogar pares de partidas (awbw4)
          no_output_timeout: 10m
          command: |
            if [ -z "${AI_TRAINING_KEY:-}" ]; then
              echo "Falta a variável AI_TRAINING_KEY (a chave dos workers do awbw4) no projeto do CircleCI." >&2
              exit 2
            fi
            curl -fsSL "<< pipeline.parameters.site >>/treino/remote-worker.mjs" -o awbw-worker.mjs
            LIMIT=()
            if [ "<< pipeline.parameters.jobs_per_runner >>" != "0" ]; then LIMIT=(--limite "<< pipeline.parameters.jobs_per_runner >>"); fi
            CAMPAIGN=()
            if [ -n "<< pipeline.parameters.campaign >>" ]; then CAMPAIGN=(--campanha "<< pipeline.parameters.campaign >>"); fi
            # no fim do tempo, SIGINT: acaba as partidas a meio, envia-as e devolve o resto
            timeout --preserve-status -s INT -k 5m "<< pipeline.parameters.minutes >>m" \
              node awbw-worker.mjs \
                --url "<< pipeline.parameters.site >>" \
                --workers "<< pipeline.parameters.workers >>" "${LIMIT[@]}" "${CAMPAIGN[@]}" \
                --dispositivo "circleci-${CIRCLE_WORKFLOW_ID}-${CIRCLE_NODE_INDEX}" \
                --nome "CircleCI #${CIRCLE_BUILD_NUM} máquina $((CIRCLE_NODE_INDEX + 1))/${CIRCLE_NODE_TOTAL}"

workflows:
  training:
    when: << pipeline.parameters.run_training >>
    jobs:
      - ai-training
