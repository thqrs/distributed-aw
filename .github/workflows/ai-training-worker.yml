name: AI training worker (manual)

on:
  workflow_dispatch:
    inputs:
      site:
        description: "AI Training base URL"
        required: true
        default: "https://awbw.vitamindanswers.com/ai-training"
        type: string
      campaign:
        description: "Campaign ID"
        required: true
        default: "breadth-100k"
        type: string
      seeds_per_job:
        description: "Seeds to submit per runner"
        required: true
        default: "50"
        type: string
      workers:
        description: "Node worker threads per runner"
        required: true
        default: "4"
        type: string
      shards_json:
        description: 'Parallel runner IDs as JSON. Default launches 8 runners; up to 20 can run concurrently.'
        required: true
        default: "[1,2,3,4,5,6,7,8]"
        type: string

permissions:
  contents: read

jobs:
  train:
    name: shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJSON(inputs.shards_json) }}
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Locate remote worker
        id: locate
        shell: bash
        run: |
          if [ -f "ai-training/remote-worker.mjs" ]; then
            echo "worker=ai-training/remote-worker.mjs" >> "$GITHUB_OUTPUT"
          elif [ -f "awbw3/ai-training/remote-worker.mjs" ]; then
            echo "worker=awbw3/ai-training/remote-worker.mjs" >> "$GITHUB_OUTPUT"
          else
            echo "remote-worker.mjs not found" >&2
            exit 1
          fi

      - name: Run bounded AI-training batch
        env:
          AI_TRAINING_URL: ${{ inputs.site }}
          AI_TRAINING_KEY: ${{ secrets.AI_TRAINING_KEY }}
        shell: bash
        run: |
          if [ -z "$AI_TRAINING_KEY" ]; then
            echo "Repository secret AI_TRAINING_KEY is missing." >&2
            exit 2
          fi
          node "${{ steps.locate.outputs.worker }}" \
            --campaign "${{ inputs.campaign }}" \
            --workers "${{ inputs.workers }}" \
            --limit "${{ inputs.seeds_per_job }}" \
            --claim auto \
            --device-id "gha-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}" \
            --name "GitHub Actions #${{ github.run_number }} shard ${{ matrix.shard }}"
